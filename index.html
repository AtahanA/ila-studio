<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ILA Studio</title>
    <!-- The theme, before the bundle and its stylesheet arrive: a start must not flash the other theme's
         background. Key and default as in src/theme.ts; the colours are --bg-primary of App.css. -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("ila-studio-theme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html { background-color: #0a0d14; }
      html[data-theme="light"] { background-color: #f3f5f8; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
