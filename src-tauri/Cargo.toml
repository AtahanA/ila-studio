[package]
name = "ila-studio"
version = "0.4.0"
description = "Capture and analysis GUI for Vivado ILA (Integrated Logic Analyzer) cores"
authors = ["Atahan Aggunlu"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AtahanA/ila-studio"
edition = "2021"
# the minimum the tauri crates in Cargo.lock declare
rust-version = "1.90"
# an application: it is not meant for crates.io
publish = false

[lib]
# The `_lib` suffix keeps the library's output files apart from the binary's on Windows (cargo issue 8519).
name = "ila_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
